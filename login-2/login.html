<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="wrapper">
        <form class="login-form">
            <h1>Welcome Back</h1>
            <p class="subtitle">Login to your account</p>

            <div class="input-box">
                <input type="email" placeholder="Email Address" required>
            </div>

            <div class="input-box password-box">
                <input id="login-password" type="password" placeholder="Password" required>
                <button type="button" class="toggle-password" data-target="login-password" aria-label="Show password"></button>
            </div>

            <div class="remember-forgot">
                <label><input type="checkbox">Remember me</label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn">Login</button>

            <div class="register-link">
                <p>Don't have an account? <a href="../login-1/login.html">Sign Up</a></p>
            </div>
        </form>
    </div>

    <script>
        var eyeOpen = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12zm11 4a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        var eyeClosed = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.58 10.58A2 2 0 0 0 13.42 13.42M9.88 5.08A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a17.64 17.64 0 0 1-5.12 6.08M6.61 6.61A17.66 17.66 0 0 0 1 12s4 7 11 7a10.91 10.91 0 0 0 4.38-.88" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

        document.querySelectorAll('.toggle-password').forEach(function(button) {
            button.innerHTML = eyeOpen;

            button.addEventListener('click', function() {
                var targetId = button.getAttribute('data-target');
                var input = document.getElementById(targetId);
                var isPassword = input.type === 'password';

                input.type = isPassword ? 'text' : 'password';
                button.innerHTML = isPassword ? eyeClosed : eyeOpen;
                button.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
            });
        });

        document.querySelectorAll('form').forEach(function(form) {
            form.addEventListener('submit', function(event) {
                var requiredInputs = form.querySelectorAll('input[required]');
                var valid = true;

                requiredInputs.forEach(function(input) {
                    if (!input.value.trim()) {
                        valid = false;
                        input.style.borderColor = '#ff6b6b';
                    } else {
                        input.style.borderColor = '';
                    }
                });

                if (!valid) {
                    event.preventDefault();
                    alert('Please fill in all required fields.');
                }
            });
        });
    </script>
</body>
</html>
